# LiteLLM Proxy configuration
# All endpoints, model names, and API keys are resolved from environment variables.
# See .env.example for the required variables.

model_list:
  # ================================================================
  # Reasoner: primary inference model
  # Fallback: local → portable → Cloud
  # ================================================================
  - model_name: reasoner
    litellm_params:
      model: os.environ/REASONER_LOCAL_MODEL
      api_base: os.environ/LLAMA_SERVER_URL
      api_key: "not-needed"
      timeout: 120

  - model_name: reasoner-portable
    litellm_params:
      model: os.environ/REASONER_PORTABLE_MODEL
      api_base: os.environ/PORTABLE_LLM_SERVER_URL
      api_key: "not-needed"
      timeout: 30

  - model_name: reasoner-cloud
    litellm_params:
      model: os.environ/REASONER_CLOUD_MODEL
      api_key: os.environ/CLOUD_API_KEY

  # ================================================================
  # Judge: evaluation model for LangChain Judge chain
  # Fallback: portable (Mac GPU) → local (Win CPU) → Cloud
  # ================================================================
  - model_name: judge
    litellm_params:
      model: os.environ/JUDGE_PORTABLE_MODEL
      api_base: os.environ/PORTABLE_LLM_SERVER_URL
      api_key: "not-needed"
      timeout: 15
      max_parallel_requests: 2

  - model_name: judge-local
    litellm_params:
      model: os.environ/JUDGE_LOCAL_MODEL
      api_base: os.environ/LLAMA_SERVER_URL
      api_key: "not-needed"
      timeout: 60
      max_parallel_requests: 4

  - model_name: judge-cloud
    litellm_params:
      model: os.environ/JUDGE_CLOUD_MODEL
      api_key: os.environ/CLOUD_API_KEY

router_settings:
  enable_pre_call_checks: true
  num_retries: 0
  timeout: 60
  cooldown_time: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true              # Ignore unsupported params per provider
  fallbacks:
    - reasoner: ["reasoner-portable", "reasoner-cloud"]
    - judge: ["judge-local", "judge-cloud"]
