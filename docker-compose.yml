# =============================================================================
# Open WebUI Stack - Docker Compose
# =============================================================================
# Open WebUI + LiteLLM Proxy + SearXNG + Cloudflare Tunnel + Watchtower
#
# Setup:
#   1. cp .env.example .env && vi .env
#   2. docker compose up -d
#
# Daily operations:
#   docker compose ps              # Check status
#   docker compose logs -f         # Follow logs
#   docker compose pull && docker compose up -d  # Manual update
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL - Shared database for multi-host Open WebUI
  # ---------------------------------------------------------------------------
  postgres:
    profiles: ["db-host"]
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=openwebui
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d openwebui"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Open WebUI - LLM Frontend
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - ${OPEN_WEBUI_DATA_DIR}:/app/backend/data
      - ${CA_CERT_PATH}:/usr/local/share/ca-certificates/rootCA.crt:ro
    environment:
      # --- Database (PostgreSQL for multi-host, omit for SQLite) ---
      - DATABASE_URL=${OPEN_WEBUI_DATABASE_URL:-}
      # --- LLM Backend ---
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-dummy}
      # --- Task Model (query generation, title generation etc.) ---
      - TASK_MODEL_EXTERNAL=judge
      # --- Web Search (SearXNG) ---
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - RAG_WEB_SEARCH_RESULT_COUNT=3
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
    command: >
      bash -c "update-ca-certificates && bash start.sh"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      searxng:
        condition: service_started
      litellm-proxy:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # LiteLLM Proxy - LLM Gateway (model routing, fallback, load balancing)
  # ---------------------------------------------------------------------------
  litellm-proxy:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ${CA_CERT_PATH}:/usr/local/share/ca-certificates/rootCA.crt:ro
    env_file:
      - .env
    entrypoint: >
      bash -c "cat /usr/local/share/ca-certificates/rootCA.crt
      >> /etc/ssl/certs/ca-certificates.crt
      && litellm --config /app/config.yaml --port 4000"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # SearXNG - Meta Search Engine
  # ---------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # ---------------------------------------------------------------------------
  # Caddy - Reverse proxy with failover (slave primary, master fallback)
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["gateway"]
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      - SLAVE_OPEN_WEBUI_URL=${SLAVE_OPEN_WEBUI_URL:-}

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel - External Access
  # ---------------------------------------------------------------------------
  cloudflared:
    profiles: ["gateway"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  # ---------------------------------------------------------------------------
  # Watchtower - Auto-update (monitors open-webui only)
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    command: --interval 300 open-webui
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  caddy_data:
